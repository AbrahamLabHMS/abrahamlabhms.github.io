name: Publication check

on:
  schedule:
    - cron: "17 14 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publication-review-queue
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out repository
        # Pinned to immutable action commit; update intentionally after review.
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false

      - name: Set up Node.js
        # Pinned to immutable action commit; update intentionally after review.
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        id: dependencies
        run: npm ci

      - name: Test publication-monitor failure handling
        id: checker-tests
        run: node --test scripts/check-publication-updates.test.mjs scripts/publication-review-issue.test.mjs

      - name: Validate site content
        run: npm run validate:content

      - name: Check publication sources
        id: publications
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' && steps.checker-tests.outcome == 'success' }}
        run: npm run check:publications

      - name: Maintain one human-review issue
        if: ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && steps.publications.outcome != 'skipped' && hashFiles('output/publication-check/report.json') != '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/lib/publication-review-issue.mjs output/publication-check/report.json

      - name: Build site for link review
        id: build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run build

      - name: Check external links
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:links

      - name: Upload publication report
        if: always()
        # Pinned to immutable action commit; update intentionally after review.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: publication-check
          path: output/publication-check

      - name: Upload link report
        if: always()
        # Pinned to immutable action commit; update intentionally after review.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: external-link-check
          path: output/link-check
